name: tests

on: [push, pull_request]

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Full test suite (pure stdlib — no install step)
        run: python -m unittest discover -s tests -v
      - name: Surface lint (design laws on files)
        run: python scripts/lint_surfaces.py
