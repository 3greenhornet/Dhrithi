<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dhriti — Sovereign Decision</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090a10;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #11131c;
      border: 1px solid #1e2436;
      border-radius: 12px;
      padding: 32px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(139, 120, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 120, 246, 0.3);
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .box {
      background: #0c0e17;
      border: 1px solid #1e2436;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 13.5px;
    }
    .box-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .box-row:last-child { margin-bottom: 0; }
    .label { color: #64748b; font-weight: 500; }
    .val { color: #f1f5f9; font-weight: 600; font-family: monospace; }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 8px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-target {
      background: #3b82f6;
      color: #ffffff;
    }
    .btn-target:hover { background: #2563eb; }
    .btn-park {
      background: #1e2436;
      color: #cbd5e1;
      border: 1px solid #2d3748;
    }
    .btn-park:hover { background: #28334a; color: #ffffff; }
    .btn-pivot {
      background: transparent;
      color: #94a3b8;
      border: 1px dashed #334155;
    }
    .btn-pivot:hover { background: rgba(255, 255, 255, 0.04); color: #cbd5e1; }
    .timer-overlay {
      display: none;
      margin-top: 16px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .timer-digits {
      font-size: 24px;
      font-weight: 700;
      color: #f59e0b;
      font-family: monospace;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Sovereign Topic Interstitial</span>
    <h1>Off-Target Search Held</h1>
    <p>
      This query diverged from today's declared placement focus.
      Choose how to route this attention impulse:
    </p>

    <div class="box">
      <div class="box-row">
        <span class="label">Query:</span>
        <span class="val" id="held-query">—</span>
      </div>
      <div class="box-row">
        <span class="label">Today's Target:</span>
        <span class="val" id="active-target">—</span>
      </div>
      <div class="box-row">
        <span class="label">Target Match:</span>
        <span class="val" id="match-score">0%</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-target" id="btn-back">
        ← Back to Target
      </button>
      <button class="btn-park" id="btn-park">
        📥 Park for 20:00 (Vidura)
      </button>
      <button class="btn-pivot" id="btn-pivot">
        ⚡ Declare Pivot &amp; Learn Anchor (30s Pause)
      </button>
    </div>

    <div class="timer-overlay" id="timer-box">
      <div style="font-size: 13px; color: #cbd5e1;">Deliberate pause before target pivot...</div>
      <div class="timer-digits" id="timer-count">30s</div>
      <button class="btn-target" id="btn-confirm-pivot" style="display: none; width: 100%;">
        Confirm Pivot &amp; Continue Search
      </button>
    </div>
  </div>

  <script src="interstitial.js"></script>
</body>
</html>
